name: Run Unit Tests

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore CSC449_SeatReservationSystem.slnx

    - name: Build project
      run: dotnet build CSC449_SeatReservationSystem.slnx --no-restore

    - name: Run Unit Tests
      run: dotnet test CSC449_SeatReservationSystem.slnx --no-build --verbosity normal
